name: Deploy Google Cloud
on:
  workflow_dispatch:
    inputs:
      enable_schedule:
        description: Start/resume collection with your configured schedule
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: commute-cloud-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west4' }}
      GCP_SERVICE: ${{ vars.GCP_SERVICE || 'traveltime' }}
      CLOUD_EXPERIMENT: ${{ vars.CLOUD_EXPERIMENT || 'commute-v1' }}
      ENABLE_SCHEDULE: ${{ inputs.enable_schedule }}
      MONITOR_START_DATE: ${{ vars.MONITOR_START_DATE }}
      MONITOR_END_DATE: ${{ vars.MONITOR_END_DATE }}
      EXCLUDE_DATES: ${{ vars.EXCLUDE_DATES }}
      COMMUTE_TIMEZONE: ${{ vars.COMMUTE_TIMEZONE || 'Europe/Amsterdam' }}
      MONITOR_WEEKDAYS: ${{ vars.MONITOR_WEEKDAYS || '0,1,2,3,4' }}
      SAMPLE_INTERVAL_MINUTES: ${{ vars.SAMPLE_INTERVAL_MINUTES || '3' }}
      MAX_LATENESS_SECONDS: ${{ vars.MAX_LATENESS_SECONDS }}
      MONTHLY_REQUEST_LIMIT: ${{ vars.MONTHLY_REQUEST_LIMIT || '4500' }}
      AM_START: ${{ vars.AM_START || '06:00' }}
      AM_END: ${{ vars.AM_END || '09:00' }}
      PM_START: ${{ vars.PM_START || '15:00' }}
      PM_END: ${{ vars.PM_END || '18:00' }}
      NDW_ENABLED: ${{ vars.NDW_ENABLED || 'true' }}
      NDW_CORRIDOR_METERS: ${{ vars.NDW_CORRIDOR_METERS || '250' }}
      DELAY_THRESHOLD_MINUTES: ${{ vars.DELAY_THRESHOLD_MINUTES || '15' }}
      TRIP_THRESHOLD_MINUTES: ${{ vars.TRIP_THRESHOLD_MINUTES || '75' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate with the deployment identity
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build service and reconcile schedules
        shell: bash
        run: |
          if [[ -z "$MAX_LATENESS_SECONDS" ]]; then
            unset MAX_LATENESS_SECONDS
          fi
          options=()
          if [[ "$ENABLE_SCHEDULE" == "true" ]]; then
            options+=(--enable-schedule)
          fi
          python -m deploy.gcp.deploy \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service "$GCP_SERVICE" --experiment "$CLOUD_EXPERIMENT" \
            "${options[@]}"
