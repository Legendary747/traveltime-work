name: Daily commute report
on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * 1-5'
      timezone: Europe/Amsterdam
permissions:
  contents: write
  id-token: write
concurrency:
  group: commute-state-writer
  cancel-in-progress: false
jobs:
  report:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_CLOUD_REPORTS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUD_EXPERIMENT: ${{ vars.CLOUD_EXPERIMENT || 'commute-v1' }}
      MONITOR_START_DATE: ${{ vars.MONITOR_START_DATE }}
      MONITOR_END_DATE: ${{ vars.MONITOR_END_DATE }}
      EXCLUDE_DATES: ${{ vars.EXCLUDE_DATES }}
      COMMUTE_TIMEZONE: ${{ vars.COMMUTE_TIMEZONE || 'Europe/Amsterdam' }}
      MONITOR_WEEKDAYS: ${{ vars.MONITOR_WEEKDAYS || '0,1,2,3,4' }}
      SAMPLE_INTERVAL_MINUTES: ${{ vars.SAMPLE_INTERVAL_MINUTES || '3' }}
      AM_START: ${{ vars.AM_START || '06:00' }}
      AM_END: ${{ vars.AM_END || '09:00' }}
      PM_START: ${{ vars.PM_START || '15:00' }}
      PM_END: ${{ vars.PM_END || '18:00' }}
      DELAY_THRESHOLD_MINUTES: ${{ vars.DELAY_THRESHOLD_MINUTES || '15' }}
      TRIP_THRESHOLD_MINUTES: ${{ vars.TRIP_THRESHOLD_MINUTES || '75' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-cloud.txt
      - name: Check live repository visibility before accessing private observations
        run: python -c "from scripts.state import require_private_origin; require_private_origin()"
      - name: Authenticate with short-lived read-only cloud identity
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_REPORT_SERVICE_ACCOUNT }}
      - name: Restore private backup branch
        run: python scripts/state.py prepare state
      - name: Export durable observations (no navigation API requests)
        run: python -m traveltime.cloud_export --db state/commute.sqlite3
      - name: Generate charts
        id: reports
        run: python -m traveltime --db state/commute.sqlite3 --output state/reports report
      - name: Persist backup and reports
        run: python scripts/state.py save state
      # Reports stay in the verified private state branch. Never publish real
      # commute data as Actions artifacts from a reusable/public source repo.
